name: Build and Deploy Docker Image

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'resources/**'

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    name: Build and Deploy Docker Image
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35

      - name: Fix Nix Store Permissions
        run: |
          sudo mkdir -p /nix
          sudo chown -R runner:runner /nix

      - name: Cache Nix Store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /nix/store
            /nix/var/nix/db
            /nix/var/nix/gcroots
            /nix/var/nix/profiles
            /nix/var/nix/temproots
          key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-

      - name: Build Docker image
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: nix build ".#dockerImage" --impure --out-link result

      - id: repository
        name: Generate Registry String
        uses: vishalmamidi/lowercase-action@652df4eb6c25fb2a1a92ec9f6d406dd1fe464e44 # v1
        with:
          string: ${{ env.REGISTRY }}/${{ github.repository }}-backend

      - name: Push Docker image to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pushing to ${{ steps.repository.outputs.lowercase }}:latest"
          skopeo copy --dest-creds "${{ github.actor }}:${GHCR_TOKEN}" docker-archive:./result docker://${{ steps.repository.outputs.lowercase }}:latest
          echo "Pushing to ${{ steps.repository.outputs.lowercase }}:build-${{ github.run_number }}"
          skopeo copy --dest-creds "${{ github.actor }}:${GHCR_TOKEN}" docker-archive:./result docker://${{ steps.repository.outputs.lowercase }}:build-${{ github.run_number }}
