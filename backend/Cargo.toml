[package]
name = "member-id"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"
env_logger = "0.11"
serde_json = "1"
serde_cbor = "0.11"
flate2 = { version = "1", features = ["zlib"] }
base45 = "3"
p256 = { version = "0.14.0-rc", features = ["ecdsa"] }
hex = "0.4"
passes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9.0", features = ["actix-web"] }
actix-governor = "0.10"
google-walletobjects1 = "7"
pem = "3"
