[package]
name = "member-id"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
jsonwebtoken = "9"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"
env_logger = "0.11"
serde_json = "1"
serde_cbor = "0.11"
flate2 = { version = "1", features = ["zlib"] }
base45 = "3"
p256 = { version = "0.14.0-rc", features = ["ecdsa"] }
hex = "0.4"
passes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
utoipa = { version = "3", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "3.1", features = ["actix-web"] }
actix-governor = "0.8"
google-walletobjects1 = "6"
pem = "3"
